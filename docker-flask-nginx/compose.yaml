services:
  app:
    build: .
    container_name: student-app
    environment:
      APP_ENV: production
    volumes:
      - student-data:/data
    restart: unless-stopped
    networks:
      - student-network

  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - student-network

volumes:
  student-data:

networks:
  student-network:
